# Enterprise SonarQube quality-gate configuration for the PFF AI Python service (ADR-D5-20).
# The enterprise Azure DevOps build.yaml runs the SonarQube scanner over this and blocks the
# pipeline on the enterprise Quality Gate — the same gate every enterprise application uses.
#
# TODO(platform-team): replace projectKey/projectName/host with the enterprise-registered
# values. The auth token and host URL are injected by the enterprise SonarQube service
# connection / variable group — never commit them here.

# TODO(platform-team): enterprise-registered project key and display name.
sonar.projectKey=fa-pff-ai
sonar.projectName=FA-PFF AI (PFF AI runtime)

# Sources and tests.
sonar.sources=src/pff_fa_ai
sonar.tests=tests
sonar.python.version=3.11

# Coverage + test reports produced by the pytest step in build.yaml.
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Exclusions: spec docs and generated/vendored content are not analysed.
sonar.exclusions=MD files/**,docs/**,**/__pycache__/**
sonar.coverage.exclusions=tests/**,scripts/**

# New-code Quality Gate conditions come from the enterprise default profile unless the
# platform team assigns a stricter one — do not weaken the gate here.
sonar.sourceEncoding=UTF-8
