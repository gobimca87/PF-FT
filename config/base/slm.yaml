# Doc 15: production must pin an explicit model version, never "latest". Provider stays
# `mock` until a specific model has been evaluated and approved.
#
# ADR-D3-29 (supersedes ADR-D3-13): the hosted-first inference plane is Azure AI Foundry
# (in-tenancy Azure), NOT the Hugging Face Inference API. Path is:
#   mock (test) -> azure_ai_foundry (hosted, in-tenancy) -> self_hosted (vLLM on AKS GPU,
#   ADR-D5-10, target). Hugging Face remains an optional eval/experimentation provider only.
# The Foundry endpoint + credential are resolved from Key Vault via *_secret_ref (ADR-D5-07)
# using the enterprise SPN / managed identity; placement is MANAGED_IN_TENANCY so the
# mandatory external-masking boundary (ADR-D6-19) does not apply (masking per task class).
#
# Example hosted config (kept commented until model evaluation + ARB sign-off):
#   provider: azure_ai_foundry
#   endpoint_secret_ref: kv:slm-foundry-endpoint
#   api_version: "2024-05-01-preview"
#   model_id: <foundry-deployment-name>
#   model_version: "<pinned-version>"
slm:
  provider: mock
  model_id: mock-slm-v1
  model_version: "1.0.0"
  temperature: 0.2
  top_p: 0.95
  max_output_tokens: 1024

retry:
  max_attempts: 3
  backoff: exponential
  initial_ms: 250
  max_ms: 5000
  jitter: true

circuit_breaker:
  failure_threshold: 5
  cooldown_seconds: 30
  half_open_max_calls: 1
