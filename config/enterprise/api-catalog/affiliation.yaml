# doc 10 / DEVELOPMENT-GUIDE Phase 23 — the 7 example tools the guide names for
# AffiliationAgent: get_club, get_application, get_teams, get_officials, get_insurance,
# get_products, get_payment_status. All read-only (doc 4 §72's checklist has the agent
# retrieve and explain, never submit the application itself — that stays a Club Portal
# action per `MD files/0 Workflow/pff_affiliation_e2e_flow.md` Phases 0-6).
#
# TODO(enterprise-integration): every `endpoint.path` below is a placeholder shape,
# not a confirmed PFF contract — replace once Enterprise Integration provides the real
# API spec (Phase 23's own scope allowance: "implement or stub with clear TODOs
# against real PFF APIs"). `authorization.claims` similarly assumes a single
# `affiliation.read` scope pending the real claims model.

- api_id: enterprise.affiliation.get_club
  name: Get Club
  version: v1
  owner: enterprise-integration
  domain: affiliation
  operation: READ
  endpoint:
    method: GET
    path: /api/v1/clubs/{clubId}
  authorization:
    required: true
    claims: [affiliation.read]
  execution:
    idempotent: true
    retryable: true
    parallelizable: true

